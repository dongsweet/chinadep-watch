<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>控制台 - Chinadep Watch</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
<div class="app-wrapper">
  <nav class="app-header navbar navbar-expand bg-body">
    <div class="container-fluid"><a href="/" class="navbar-brand"><b>Chinadep</b> Watch</a><ul class="navbar-nav ms-auto"><li class="nav-item"><button id="logout" class="btn btn-link nav-link">退出登录</button></li></ul></div>
  </nav>
  <aside class="app-sidebar bg-dark shadow" data-bs-theme="dark">
    <div class="sidebar-brand"><a href="/" class="brand-link"><span class="brand-text fw-light">资产监控平台</span></a></div>
    <div class="sidebar-wrapper"><nav><ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview"><li class="nav-item"><a href="#overview" class="nav-link active"><i class="nav-icon bi bi-speedometer2"></i><p>控制台</p></a></li><li class="nav-item"><a href="#settings" class="nav-link"><i class="nav-icon bi bi-gear"></i><p>基础设置</p></a></li><li class="nav-item"><a href="#monitoring" class="nav-link"><i class="nav-icon bi bi-graph-up"></i><p>监控配置</p></a></li></ul></nav></div>
  </aside>
  <main class="app-main"><div class="app-content-header"><div class="container-fluid"><h3 class="mb-0">控制台</h3></div></div><div class="app-content"><div class="container-fluid">
    <div class="row"><div class="col-lg-3 col-6"><div class="small-box text-bg-primary"><div class="inner"><h3 id="assetCount">0</h3><p>资产品类</p></div><i class="small-box-icon bi bi-box-seam"></i></div></div><div class="col-lg-3 col-6"><div class="small-box text-bg-success"><div class="inner"><h3 id="enabledAssetCount">0</h3><p>监控中</p></div><i class="small-box-icon bi bi-bell"></i></div></div><div class="col-lg-3 col-6"><div class="small-box text-bg-warning"><div class="inner"><h3>待接入</h3><p>价格采集</p></div><i class="small-box-icon bi bi-cloud-arrow-down"></i></div></div><div class="col-lg-3 col-6"><div class="small-box text-bg-secondary"><div class="inner"><h3 id="userName">-</h3><p>当前用户</p></div><i class="small-box-icon bi bi-person"></i></div></div></div>
    <div class="card" id="connection"><div class="card-header"><h3 class="card-title">监控平台账号连接</h3></div><div class="card-body"><p class="text-muted small">目标平台使用手机号和短信验证码登录。图形验证、短信验证码及可能出现的人脸/活体验证都需要你本人完成。</p><form id="targetLoginForm" class="row g-3"><div class="col-md-4"><label class="form-label">手机号</label><input id="targetMobile" name="mobile" class="form-control" inputmode="numeric" maxlength="11" autocomplete="tel" required></div><div class="col-md-4"><label class="form-label">图形验证</label><div id="captchaContainer" class="border rounded p-2 bg-body-secondary"><span class="text-muted small">正在加载验证组件...</span></div><input id="captchaValidate" name="validate" type="hidden"></div><div class="col-md-4 d-flex align-items-end"><button id="sendSms" class="btn btn-outline-primary w-100" type="button" disabled>获取短信验证码</button></div><div class="col-md-4"><label class="form-label">短信验证码</label><input name="code" class="form-control" inputmode="numeric" maxlength="8" autocomplete="one-time-code" required></div><div class="col-md-4"><label class="form-label">设备 Token（可选）</label><input id="deviceToken" name="deviceToken" class="form-control" maxlength="2048" placeholder="默认读取浏览器设备标识"></div><div class="col-md-4 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit">登录监控平台</button></div></form><details class="mt-3"><summary class="small text-muted">密码登录兼容入口</summary><form id="passwordLoginForm" class="row g-3 mt-1"><div class="col-md-4"><input name="mobile" class="form-control" inputmode="numeric" maxlength="11" placeholder="手机号" required></div><div class="col-md-4"><input name="password" type="password" class="form-control" autocomplete="off" placeholder="密码" required></div><div class="col-md-4"><button class="btn btn-outline-secondary w-100" type="submit">使用密码登录</button></div></form></details><div id="targetLoginMessage" class="small mt-3"></div><div id="connectionsList" class="mt-3"></div></div></div>
    <div class="row"><div class="col-lg-8"><div class="card" id="overview"><div class="card-header"><h3 class="card-title">系统概览</h3></div><div class="card-body"><div class="alert alert-info mb-0"><i class="bi bi-info-circle me-2"></i>平台登录和基础信息已就绪，下一步接入监控品类、价格快照和定时更新。</div></div></div></div><div class="col-lg-4"><div class="card" id="settings"><div class="card-header"><h3 class="card-title">基础设置</h3></div><div class="card-body"><label class="form-label">平台名称</label><input id="platformName" class="form-control mb-3" placeholder="Chinadep Watch"><button id="saveSettings" class="btn btn-primary">保存设置</button><span id="saveMessage" class="small text-success ms-2"></span></div></div></div></div>
    <div class="card" id="monitoring"><div class="card-header d-flex align-items-center"><h3 class="card-title mb-0">资产品类管理</h3><div class="ms-auto d-flex gap-2"><input id="assetSearch" class="form-control form-control-sm" placeholder="搜索名称/发行方/类型" style="width:220px"><button id="syncAssets" class="btn btn-sm btn-primary"><i class="bi bi-arrow-repeat me-1"></i>同步目标平台资产</button></div></div><div class="card-body p-0"><div id="assetMessage" class="small px-3 pt-3"></div><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>资产</th><th>发行方</th><th>类型</th><th>发行价</th><th>交易时间</th><th>状态</th><th class="text-end">操作</th></tr></thead><tbody id="assetsList"><tr><td colspan="7" class="text-muted text-center py-4">还没有同步资产目录</td></tr></tbody></table></div></div></div>
  </div></div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/js/adminlte.min.js"></script><script src="https://cstaticdun.126.net/load.min.js?t=201903281201"></script>
<script>
  async function ensureAuth() { const r = await fetch('/api/auth/me'); if (!r.ok) { location.href = '/login'; return null; } const d = await r.json(); document.getElementById('userName').textContent = d.user.displayName || d.user.username; return d; }
  async function loadSettings() { const r = await fetch('/api/settings'); if (!r.ok) return; const d = await r.json(); const item = d.settings.find(x => x.key === 'platform.name'); if (item) document.getElementById('platformName').value = item.value; }
  async function loadConnections() { const r = await fetch('/api/connections'); if (!r.ok) return; const d = await r.json(); const list = document.getElementById('connectionsList'); list.innerHTML = d.connections.length ? d.connections.map(item => `<div class="border rounded p-2 mb-2"><i class="bi bi-check-circle text-success me-2"></i>${item.mobile} <span class="badge text-bg-success ms-2">已登录</span><span class="text-muted small ms-2">${item.nickName || ''}</span></div>`).join('') : '<div class="text-muted small">还没有连接监控平台账号</div>'; }
  function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character])); }
  function formatAssetDate(start, end) { if (!start && !end) return '-'; return `${escapeHtml(start || '?')}<br><span class="text-muted small">至 ${escapeHtml(end || '?')}</span>`; }
  async function loadAssets() { const query = document.getElementById('assetSearch').value.trim(); const url = query ? `/api/assets?q=${encodeURIComponent(query)}` : '/api/assets'; const response = await fetch(url); if (!response.ok) return; const data = await response.json(); const list = document.getElementById('assetsList'); const assets = data.assets || []; document.getElementById('assetCount').textContent = assets.length; document.getElementById('enabledAssetCount').textContent = assets.filter(asset => asset.enabled).length; list.innerHTML = assets.length ? assets.map(asset => `<tr><td><div class="fw-semibold">${escapeHtml(asset.name)}</div><div class="text-muted small">目标 ID: ${escapeHtml(asset.targetAssetId)} · 连接: ${escapeHtml(asset.connectionMobile)}</div>${asset.note ? `<div class="small text-info mt-1">备注：${escapeHtml(asset.note)}</div>` : ''}</td><td>${escapeHtml(asset.issuerName || '-')}</td><td>${escapeHtml(asset.assetsTypeName || asset.assetsFileTypeName || '-')}</td><td>${asset.issuePrice === null ? '-' : escapeHtml(asset.issuePrice)}</td><td>${formatAssetDate(asset.tradeStartTime, asset.tradeEndTime)}</td><td><span class="badge ${asset.enabled ? 'text-bg-success' : 'text-bg-secondary'}">${asset.enabled ? '监控中' : '已停用'}</span></td><td class="text-end"><button class="btn btn-sm btn-outline-secondary asset-toggle" data-id="${asset.id}" data-enabled="${asset.enabled}">${asset.enabled ? '停用' : '启用'}</button><button class="btn btn-sm btn-outline-primary ms-1 asset-note" data-id="${asset.id}" data-note="${escapeHtml(asset.note)}">备注</button></td></tr>`).join('') : '<tr><td colspan="7" class="text-muted text-center py-4">没有匹配的资产</td></tr>'; }
  async function syncAssets() { const button = document.getElementById('syncAssets'); const assetMessage = document.getElementById('assetMessage'); button.disabled = true; assetMessage.className = 'small px-3 pt-3 text-muted'; assetMessage.textContent = '正在从目标平台同步资产目录...'; try { const response = await fetch('/api/assets/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({}) }); const data = await response.json(); assetMessage.className = `small px-3 pt-3 ${data.success ? 'text-success' : 'text-danger'}`; assetMessage.textContent = data.success ? `同步完成：新增/更新 ${data.synced} 项，共发现 ${data.totalAvailable} 项` : (data.message || '同步失败'); if (data.success) await loadAssets(); } catch (error) { assetMessage.className = 'small px-3 pt-3 text-danger'; assetMessage.textContent = '同步请求失败，请稍后重试'; } finally { button.disabled = false; } }
  document.getElementById('assetSearch').addEventListener('input', () => loadAssets());
  document.getElementById('syncAssets').addEventListener('click', syncAssets);
  document.getElementById('assetsList').addEventListener('click', async event => { const button = event.target.closest('button'); if (!button) return; const id = Number(button.dataset.id); if (button.classList.contains('asset-toggle')) { const enabled = button.dataset.enabled !== 'true'; await fetch(`/api/assets/${id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ enabled }) }); await loadAssets(); return; } if (button.classList.contains('asset-note')) { const note = window.prompt('请输入资产备注（最多 500 个字符）', button.dataset.note || ''); if (note === null) return; const response = await fetch(`/api/assets/${id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ note }) }); const data = await response.json(); if (!data.success) window.alert(data.message || '保存备注失败'); await loadAssets(); } });
  const captchaId = '2b9f754fbd9c48628e3b834c4fb519d2';
  const message = document.getElementById('targetLoginMessage');
  const deviceToken = document.getElementById('deviceToken');
  deviceToken.value = localStorage.getItem('tdid') || '';
  function setMessage(text, type = 'muted') { message.textContent = text; message.className = `small mt-3 text-${type}`; }
  async function fetchJson(url, options, timeoutMs = 20000) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const response = await fetch(url, { ...options, signal: controller.signal });
      let data;
      try {
        data = await response.json();
      } catch (error) {
        throw new Error(`服务返回了无法解析的响应（HTTP ${response.status}）`);
      }
      return { response, data };
    } finally {
      clearTimeout(timeout);
    }
  }
  function initCaptcha() {
    if (!window.initNECaptcha) { setMessage('图形验证组件加载失败，请刷新页面重试', 'danger'); return; }
    window.initNECaptcha({
      captchaId,
      element: '#captchaContainer',
      mode: 'embed',
      onVerify(error, data) {
        const validate = data && data.validate;
        document.getElementById('captchaValidate').value = validate || '';
        document.getElementById('sendSms').disabled = !validate;
      },
    }, () => {}, error => { setMessage('图形验证初始化失败，请刷新页面重试', 'danger'); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initCaptcha); else initCaptcha();
  document.getElementById('sendSms').addEventListener('click', async event => { const button = event.currentTarget; const mobile = document.getElementById('targetMobile').value.trim(); const validate = document.getElementById('captchaValidate').value; if (!/^1[3-9]\d{9}$/.test(mobile)) { setMessage('请输入正确的手机号', 'danger'); return; } if (!validate) { setMessage('请先完成图形验证', 'warning'); return; } button.disabled = true; let seconds = 60; const timer = setInterval(() => { seconds -= 1; button.textContent = `${seconds}s 后重新获取`; if (seconds <= 0) { clearInterval(timer); button.disabled = false; button.textContent = '获取短信验证码'; } }, 1000); setMessage('正在发送短信验证码...', 'muted'); try { const { data } = await fetchJson('/api/connections/sms/send', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ mobile, validate, deviceToken: deviceToken.value }) }); if (!data.success) { clearInterval(timer); button.disabled = false; button.textContent = '获取短信验证码'; } setMessage(data.message || (data.success ? '短信验证码已发送' : '验证码发送失败'), data.success ? 'success' : 'danger'); } catch (error) { clearInterval(timer); button.disabled = false; button.textContent = '获取短信验证码'; setMessage(error.name === 'AbortError' ? '短信发送超时，请检查网络后重试' : (error.message || '短信发送失败，请重试'), 'danger'); } });
  document.getElementById('targetLoginForm').addEventListener('submit', async event => { event.preventDefault(); const formElement = event.currentTarget; const form = new FormData(formElement); setMessage('正在登录监控平台...', 'muted'); try { const { data: d } = await fetchJson('/api/connections/sms/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.fromEntries(form)) }); if (d.status === 'challenge_required' && d.challengeUrl) { message.innerHTML = `需要完成验证：<a href="${d.challengeUrl}" target="_blank" rel="noreferrer">打开活体验证页面</a>`; message.className = 'small mt-3 text-warning'; return; } setMessage(d.success ? '监控平台登录成功' : (d.message || '登录失败'), d.success ? 'success' : 'danger'); if (d.success) { formElement.reset(); deviceToken.value = localStorage.getItem('tdid') || ''; await loadConnections(); } } catch (error) { setMessage(error.name === 'AbortError' ? '登录请求超时，请重试' : (error.message || '登录失败，请重试'), 'danger'); } });
  document.getElementById('passwordLoginForm').addEventListener('submit', async event => { event.preventDefault(); const formElement = event.currentTarget; const form = new FormData(formElement); setMessage('正在使用密码登录...', 'muted'); try { const { data: d } = await fetchJson('/api/connections/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.fromEntries(form)) }); if (d.status === 'challenge_required' && d.challengeUrl) { message.innerHTML = `需要完成验证：<a href="${d.challengeUrl}" target="_blank" rel="noreferrer">打开活体验证页面</a>`; message.className = 'small mt-3 text-warning'; return; } setMessage(d.success ? '监控平台登录成功' : (d.message || '登录失败'), d.success ? 'success' : 'danger'); if (d.success) { formElement.reset(); await loadConnections(); } } catch (error) { setMessage(error.name === 'AbortError' ? '登录请求超时，请重试' : (error.message || '登录失败，请重试'), 'danger'); } });
  document.getElementById('logout').onclick = async () => { await fetch('/api/auth/logout', { method: 'POST' }); location.href = '/login'; };
  document.getElementById('saveSettings').onclick = async () => { const value = document.getElementById('platformName').value.trim(); const r = await fetch('/api/settings', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ 'platform.name': value }) }); document.getElementById('saveMessage').textContent = r.ok ? '已保存' : '保存失败'; };
  ensureAuth().then(async auth => { if (!auth) return; await loadSettings(); await loadConnections(); await loadAssets(); });
</script>
</body>
</html>
