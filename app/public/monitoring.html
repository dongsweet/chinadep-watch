<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>价格监控 - Chinadep Watch</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/css/adminlte.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="/console.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary"><div class="app-wrapper">
  <nav class="app-header navbar navbar-expand bg-body"><div class="container-fluid"><a href="/accounts" class="navbar-brand brand-mark"><b>Chinadep</b> Watch</a><ul class="navbar-nav ms-auto align-items-center"><li class="nav-item me-2 text-muted small"><i class="bi bi-person-circle me-1"></i><span id="userName">-</span></li><li class="nav-item"><button id="logout" class="btn btn-link nav-link">退出登录</button></li></ul></div></nav>
  <aside class="app-sidebar bg-dark shadow" data-bs-theme="dark"><div class="sidebar-brand"><a href="/accounts" class="brand-link"><span class="brand-text fw-light">资产监控平台</span></a></div><div class="sidebar-wrapper"><nav><ul class="nav sidebar-menu flex-column"><li class="nav-item"><a href="/accounts" class="nav-link" data-page="accounts"><i class="nav-icon bi bi-box-arrow-in-right"></i><p>平台登录</p></a></li><li class="nav-item"><a href="/products" class="nav-link" data-page="products"><i class="nav-icon bi bi-box-seam"></i><p>商品列表</p></a></li><li class="nav-item"><a href="/monitoring" class="nav-link" data-page="monitoring"><i class="nav-icon bi bi-bell"></i><p>价格监控</p></a></li></ul></nav></div></aside>
  <main class="app-main"><div class="app-content-header"><div class="container-fluid d-flex align-items-center justify-content-between"><h3 class="mb-0">价格监控</h3><button id="addMonitor" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>添加监控</button></div></div><div class="app-content"><div class="container-fluid">
    <div id="alertList" class="alert-list mb-3"></div><div class="row g-3 mb-3"><div class="col-md-4"><div class="card metric-card h-100"><div class="card-body"><div class="text-muted small">监控规则</div><div id="monitorCount" class="metric-value">0</div></div></div></div><div class="col-md-4"><div class="card metric-card h-100"><div class="card-body"><div class="text-muted small">触发提醒</div><div id="alertCount" class="metric-value text-danger">0</div></div></div></div><div class="col-md-4"><div class="card metric-card h-100"><div class="card-body"><div class="text-muted small">最近检查</div><div id="checkedAt" class="metric-value fs-6">-</div></div></div></div></div>
    <div class="card"><div class="card-header d-flex align-items-center"><h3 class="card-title mb-0">监控规则</h3><button id="checkNow" class="btn btn-sm btn-outline-primary ms-auto"><i class="bi bi-arrow-clockwise me-1"></i>立即检查价格</button></div><div class="card-body p-0"><div id="monitorMessage" class="small px-3 pt-3"></div><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>商品</th><th>提醒条件</th><th>当前价格</th><th>状态</th><th>最近检查</th><th class="text-end">操作</th></tr></thead><tbody id="monitorList"><tr><td colspan="6" class="empty-state">还没有添加监控规则</td></tr></tbody></table></div></div></div>
    <div class="text-muted small mt-3"><i class="bi bi-info-circle me-1"></i>页面每 60 秒自动检查一次。当前仅在本页面显示提醒，不会发送短信或第三方通知。若目标平台隐藏挂牌价格，当前价格会显示为“暂无”。</div>
  </div></div></main>
</div>
<div class="modal fade" id="monitorModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 id="monitorModalTitle" class="modal-title">添加价格监控</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div><form id="monitorForm"><div class="modal-body"><div class="mb-3"><label class="form-label">选择商品</label><select id="monitorAssetId" name="assetId" class="form-select" required></select></div><div class="mb-3"><label class="form-label">低于此价格提醒</label><div class="input-group"><span class="input-group-text">￥</span><input id="thresholdPrice" name="thresholdPrice" type="number" min="0" max="999999999" step="0.01" class="form-control" required></div><div class="form-text">价格低于阈值后，页面顶部会显示提醒。</div></div><div id="monitorFormMessage" class="small"></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button type="submit" class="btn btn-primary">保存监控</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/js/adminlte.min.js"></script><script src="/console.js"></script>
<script>
  const { escapeHtml, formatDate, formatNumber, fetchJson, requireAuth, initShell } = ConsoleApp;
  const monitorModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('monitorModal'));
  let monitorAssets = []; let monitors = []; let editingMonitorId = null; let pollTimer = null;
  function setMonitorMessage(text, type = 'muted') { const el = document.getElementById('monitorMessage'); el.className = `small px-3 pt-3 text-${type}`; el.textContent = text; }
  async function loadAssetsForSelect() { const response = await fetch('/api/assets'); if (!response.ok) return; monitorAssets = (await response.json()).assets || []; const select = document.getElementById('monitorAssetId'); select.innerHTML = monitorAssets.length ? monitorAssets.map(asset => `<option value="${asset.id}">${escapeHtml(asset.name)} · ${escapeHtml(asset.issuerName || '')}</option>`).join('') : '<option value="">请先到商品列表同步资产</option>'; }
  function renderAlerts(alerts) { document.getElementById('alertCount').textContent = alerts.length; const box = document.getElementById('alertList'); box.innerHTML = alerts.length ? alerts.map(alert => `<div class="alert alert-danger d-flex align-items-center"><i class="bi bi-exclamation-triangle-fill me-2"></i><div><strong>${escapeHtml(alert.assetName)}</strong> 当前价格 ￥${formatNumber(alert.currentPrice)}，低于提醒线 ￥${formatNumber(alert.thresholdPrice)}<div class="small">触发时间：${formatDate(alert.lastAlertAt)}</div></div></div>`).join('') : ''; }
  function renderMonitors() { document.getElementById('monitorCount').textContent = monitors.length; const list = document.getElementById('monitorList'); list.innerHTML = monitors.length ? monitors.map(monitor => `<tr><td><div class="fw-semibold">${escapeHtml(monitor.assetName)}</div><div class="text-muted small">目标 ID ${escapeHtml(monitor.targetAssetId)} · ${escapeHtml(monitor.connectionMobile)}</div></td><td>低于 <strong>￥${formatNumber(monitor.thresholdPrice)}</strong></td><td>${monitor.currentPrice === null ? '<span class="text-muted">暂无</span>' : `￥${formatNumber(monitor.currentPrice)}`}</td><td>${monitor.alertActive ? '<span class="badge text-bg-danger">低价提醒</span>' : monitor.enabled ? '<span class="badge text-bg-success">监控中</span>' : '<span class="badge text-bg-secondary">已停用</span>'}</td><td>${formatDate(monitor.lastCheckedAt)}</td><td class="text-end"><button class="btn btn-sm btn-outline-primary edit-monitor" data-id="${monitor.id}">调整</button><button class="btn btn-sm btn-outline-secondary ms-1 toggle-monitor" data-id="${monitor.id}" data-enabled="${monitor.enabled}">${monitor.enabled ? '停用' : '启用'}</button><button class="btn btn-sm btn-outline-danger ms-1 remove-monitor" data-id="${monitor.id}">删除</button></td></tr>`).join('') : '<tr><td colspan="6" class="empty-state">还没有添加监控规则，请点击右上角添加。</td></tr>'; }
  async function loadStatus(showMessage = false) { if (showMessage) setMonitorMessage('正在检查目标平台价格...', 'muted'); try { const { data } = await fetchJson('/api/monitors/status', undefined, 30000); if (!data.success) throw new Error(data.message || '价格检查失败'); monitors = data.monitors || []; renderMonitors(); renderAlerts(data.alerts || []); document.getElementById('checkedAt').textContent = formatDate(data.checkedAt); if (showMessage) setMonitorMessage(`检查完成：${monitors.length} 条规则`, 'success'); } catch (error) { if (showMessage) setMonitorMessage(error.message || '价格检查失败', 'danger'); } }
  function openCreate() { editingMonitorId = null; document.getElementById('monitorModalTitle').textContent = '添加价格监控'; document.getElementById('monitorForm').reset(); document.getElementById('monitorFormMessage').textContent = ''; document.getElementById('monitorAssetId').disabled = false; monitorModal.show(); }
  function openEdit(id) { const monitor = monitors.find(item => item.id === id); if (!monitor) return; editingMonitorId = id; document.getElementById('monitorModalTitle').textContent = '调整价格监控'; document.getElementById('monitorAssetId').value = monitor.assetId; document.getElementById('monitorAssetId').disabled = true; document.getElementById('thresholdPrice').value = monitor.thresholdPrice; document.getElementById('monitorFormMessage').textContent = ''; monitorModal.show(); }
  document.getElementById('addMonitor').addEventListener('click', openCreate); document.getElementById('checkNow').addEventListener('click', () => loadStatus(true)); document.getElementById('monitorList').addEventListener('click', async event => { const button = event.target.closest('button'); if (!button) return; const id = Number(button.dataset.id); if (button.classList.contains('edit-monitor')) return openEdit(id); if (button.classList.contains('toggle-monitor')) { await fetchJson(`/api/monitors/${id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ enabled: button.dataset.enabled !== 'true' }) }); return loadStatus(false); } if (button.classList.contains('remove-monitor') && window.confirm('确定删除这条监控规则吗？')) { await fetchJson(`/api/monitors/${id}`, { method: 'DELETE' }); return loadStatus(false); } });
  document.getElementById('monitorForm').addEventListener('submit', async event => { event.preventDefault(); const form = event.currentTarget; const message = document.getElementById('monitorFormMessage'); const body = { assetId: Number(document.getElementById('monitorAssetId').value), thresholdPrice: Number(document.getElementById('thresholdPrice').value) }; const url = editingMonitorId ? `/api/monitors/${editingMonitorId}` : '/api/monitors'; const method = editingMonitorId ? 'PATCH' : 'POST'; try { const { data } = await fetchJson(url, { method, headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); if (!data.success) throw new Error(data.message || '保存失败'); monitorModal.hide(); await loadStatus(false); } catch (error) { message.className = 'small text-danger'; message.textContent = error.message || '保存失败'; } });
  document.getElementById('monitorModal').addEventListener('hidden.bs.modal', () => { document.getElementById('monitorAssetId').disabled = false; });
  requireAuth().then(async user => { if (!user) return; initShell('monitoring'); await loadAssetsForSelect(); await loadStatus(false); pollTimer = setInterval(() => loadStatus(false), 60000); });
</script></body></html>
