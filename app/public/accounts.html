<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>平台登录 - Chinadep Watch</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/console.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
<div class="app-wrapper">
  <nav class="app-header navbar navbar-expand bg-body"><div class="container-fluid"><a href="/accounts.html" class="navbar-brand brand-mark"><b>Chinadep</b> Watch</a><ul class="navbar-nav ms-auto align-items-center"><li class="nav-item me-2 text-muted small"><i class="bi bi-person-circle me-1"></i><span id="userName">-</span></li><li class="nav-item"><button id="logout" class="btn btn-link nav-link">退出登录</button></li></ul></div></nav>
  <aside class="app-sidebar bg-dark shadow" data-bs-theme="dark"><div class="sidebar-brand"><a href="/accounts.html" class="brand-link"><span class="brand-text fw-light">资产监控平台</span></a></div><div class="sidebar-wrapper"><nav><ul class="nav sidebar-menu flex-column"><li class="nav-item"><a href="/accounts.html" class="nav-link" data-page="accounts"><i class="nav-icon bi bi-box-arrow-in-right"></i><p>平台登录</p></a></li><li class="nav-item"><a href="/products.html" class="nav-link" data-page="products"><i class="nav-icon bi bi-box-seam"></i><p>商品列表</p></a></li><li class="nav-item"><a href="/monitoring.html" class="nav-link" data-page="monitoring"><i class="nav-icon bi bi-bell"></i><p>价格监控</p></a></li></ul></nav></div></aside>
  <main class="app-main"><div class="app-content-header"><div class="container-fluid d-flex align-items-center justify-content-between"><h3 class="mb-0">平台登录</h3><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#targetLoginModal"><i class="bi bi-plus-lg me-1"></i>添加平台账号</button></div></div><div class="app-content"><div class="container-fluid">
    <div class="row g-3 mb-3"><div class="col-md-4"><div class="card metric-card h-100"><div class="card-body"><div class="text-muted small">已连接账号</div><div id="connectionCount" class="metric-value">0</div></div></div></div><div class="col-md-4"><div class="card metric-card h-100"><div class="card-body"><div class="text-muted small">最近登录</div><div id="lastLogin" class="metric-value fs-5">-</div></div></div></div><div class="col-md-4"><div class="card metric-card h-100"><div class="card-body"><div class="text-muted small">登录方式</div><div class="metric-value fs-5">短信验证码</div></div></div></div></div>
    <div class="card"><div class="card-header d-flex align-items-center"><h3 class="card-title mb-0">监控平台账号</h3><button id="refreshConnections" class="btn btn-sm btn-outline-secondary ms-auto"><i class="bi bi-arrow-clockwise me-1"></i>刷新状态</button></div><div class="card-body"><div id="connectionMessage" class="small mb-3"></div><div id="connectionsList" class="row g-3"><div class="empty-state">正在加载账号状态...</div></div></div></div>
  </div></div></main>
</div>
<div class="modal fade" id="targetLoginModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">登录监控平台账号</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div><div class="modal-body"><p class="text-muted small">目标平台使用手机号和短信验证码登录。图形验证、短信验证码及可能出现的人脸/活体验证需要你本人完成。</p><form id="targetLoginForm" class="row g-3"><div class="col-md-6"><label class="form-label">手机号</label><input id="targetMobile" name="mobile" class="form-control" inputmode="numeric" maxlength="11" autocomplete="tel" required></div><div class="col-md-6"><label class="form-label">短信验证码</label><input name="code" class="form-control" inputmode="numeric" maxlength="8" autocomplete="one-time-code" required></div><div class="col-md-8"><label class="form-label">图形验证</label><div id="captchaContainer" class="captcha-box border rounded p-2 bg-body-secondary"><span class="text-muted small">打开窗口后加载验证组件...</span></div><input id="captchaValidate" name="validate" type="hidden"></div><div class="col-md-4 d-flex align-items-end"><button id="sendSms" class="btn btn-outline-primary w-100" type="button" disabled>获取短信验证码</button></div><div class="col-12"><label class="form-label">设备 Token <span class="text-muted">（可选）</span></label><input id="deviceToken" name="deviceToken" class="form-control" maxlength="2048" placeholder="默认读取浏览器设备标识"></div><div id="targetLoginMessage" class="small"></div><div class="col-12 text-end"><button type="submit" class="btn btn-primary">登录监控平台</button></div></form><details class="mt-3"><summary class="small text-muted">密码登录兼容入口</summary><form id="passwordLoginForm" class="row g-3 mt-1"><div class="col-md-5"><input name="mobile" class="form-control" inputmode="numeric" maxlength="11" placeholder="手机号" required></div><div class="col-md-5"><input name="password" type="password" class="form-control" autocomplete="off" placeholder="密码" required></div><div class="col-md-2"><button class="btn btn-outline-secondary w-100" type="submit">密码登录</button></div></form></details></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/js/adminlte.min.js"></script><script src="https://cstaticdun.126.net/load.min.js?t=201903281201"></script><script src="/console.js"></script>
<script>
  const { escapeHtml, formatDate, fetchJson, requireAuth, initShell } = ConsoleApp;
  const captchaId = '2b9f754fbd9c48628e3b834c4fb519d2';
  const loginModalElement = document.getElementById('targetLoginModal');
  const loginModal = bootstrap.Modal.getOrCreateInstance(loginModalElement);
  const message = document.getElementById('targetLoginMessage');
  const deviceToken = document.getElementById('deviceToken');
  let captchaReady = false;
  let captchaInstance = null;
  let smsTimer = null;
  deviceToken.value = localStorage.getItem('tdid') || '';
  function setMessage(text, type = 'muted') { message.textContent = text; message.className = `small text-${type}`; }
  function initCaptcha() {
    if (captchaReady) return;
    if (!window.initNECaptcha) { setMessage('图形验证组件加载失败，请刷新页面重试', 'danger'); return; }
    window.initNECaptcha({ captchaId, element: '#captchaContainer', mode: 'embed', onVerify(error, data) { const validate = data && data.validate; document.getElementById('captchaValidate').value = validate || ''; document.getElementById('sendSms').disabled = !validate; } }, instance => { captchaInstance = instance; captchaReady = true; }, () => setMessage('图形验证初始化失败，请刷新页面重试', 'danger'));
  }
  loginModalElement.addEventListener('shown.bs.modal', initCaptcha);
  async function loadConnections() {
    const response = await fetch('/api/connections'); if (!response.ok) return;
    const data = await response.json(); const connections = data.connections || [];
    document.getElementById('connectionCount').textContent = connections.length;
    document.getElementById('lastLogin').textContent = connections[0] ? formatDate(connections[0].lastLoginAt) : '-';
    const list = document.getElementById('connectionsList');
    list.innerHTML = connections.length ? connections.map(item => `<div class="col-md-6"><div class="card connection-card h-100"><div class="card-body"><div class="d-flex align-items-center mb-2"><i class="bi bi-phone me-2 text-primary"></i><strong>${escapeHtml(item.mobile)}</strong><span class="badge text-bg-success ms-auto"><span class="status-dot online"></span>已登录</span></div><div class="text-muted small mb-2">昵称：${escapeHtml(item.nickName || '-')}</div><div class="text-muted small">最近登录：${formatDate(item.lastLoginAt)}</div><div class="text-muted small">状态更新时间：${formatDate(item.updatedAt)}</div></div></div></div>`).join('') : '<div class="empty-state">还没有连接监控平台账号，请点击右上角添加。</div>';
  }
  function resetSmsForm() { document.getElementById('captchaValidate').value = ''; document.getElementById('sendSms').disabled = true; if (smsTimer) { clearInterval(smsTimer); smsTimer = null; } document.getElementById('sendSms').textContent = '获取短信验证码'; }
  document.getElementById('sendSms').addEventListener('click', async event => { const button = event.currentTarget; const mobile = document.getElementById('targetMobile').value.trim(); const validate = document.getElementById('captchaValidate').value; if (!/^1[3-9]\d{9}$/.test(mobile)) return setMessage('请输入正确的手机号', 'danger'); if (!validate) return setMessage('请先完成图形验证', 'warning'); button.disabled = true; let seconds = 60; smsTimer = setInterval(() => { seconds -= 1; button.textContent = `${seconds}s 后重新获取`; if (seconds <= 0) { clearInterval(smsTimer); smsTimer = null; button.disabled = false; button.textContent = '获取短信验证码'; } }, 1000); setMessage('正在发送短信验证码...', 'muted'); try { const { data } = await fetchJson('/api/connections/sms/send', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ mobile, validate, deviceToken: deviceToken.value }) }); if (!data.success) { clearInterval(smsTimer); smsTimer = null; button.disabled = false; button.textContent = '获取短信验证码'; } setMessage(data.message || (data.success ? '短信验证码已发送' : '验证码发送失败'), data.success ? 'success' : 'danger'); } catch (error) { if (smsTimer) clearInterval(smsTimer); smsTimer = null; button.disabled = false; button.textContent = '获取短信验证码'; setMessage(error.message || '短信发送失败，请重试', 'danger'); } });
  async function submitTargetLogin(url, formElement, successText) { const form = new FormData(formElement); setMessage('正在登录监控平台...', 'muted'); try { const { data } = await fetchJson(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.fromEntries(form)) }); if (data.status === 'challenge_required' && data.challengeUrl) { message.innerHTML = `需要完成验证：<a href="${escapeHtml(data.challengeUrl)}" target="_blank" rel="noreferrer">打开活体验证页面</a>`; message.className = 'small text-warning'; return; } setMessage(data.success ? successText : (data.message || '登录失败'), data.success ? 'success' : 'danger'); if (data.success) { formElement.reset(); deviceToken.value = localStorage.getItem('tdid') || ''; resetSmsForm(); await loadConnections(); setTimeout(() => loginModal.hide(), 500); } } catch (error) { setMessage(error.message || '登录失败，请重试', 'danger'); } }
  document.getElementById('targetLoginForm').addEventListener('submit', event => { event.preventDefault(); submitTargetLogin('/api/connections/sms/login', event.currentTarget, '监控平台登录成功'); });
  document.getElementById('passwordLoginForm').addEventListener('submit', event => { event.preventDefault(); submitTargetLogin('/api/connections/login', event.currentTarget, '监控平台登录成功'); });
  loginModalElement.addEventListener('hidden.bs.modal', () => { document.getElementById('targetLoginForm').reset(); document.getElementById('passwordLoginForm').reset(); deviceToken.value = localStorage.getItem('tdid') || ''; resetSmsForm(); setMessage(''); });
  document.getElementById('refreshConnections').addEventListener('click', loadConnections);
  requireAuth().then(user => { if (!user) return; initShell('accounts'); loadConnections(); });
</script>
</body>
</html>
