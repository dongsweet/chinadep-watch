<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - Chinadep Watch</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="login-page bg-body-secondary">
  <div class="login-box">
    <div class="card card-outline card-primary">
      <div class="card-header text-center"><b>Chinadep</b> Watch</div>
      <div class="card-body login-card-body">
        <p class="login-box-msg">登录监控平台</p>
        <form id="loginForm">
          <div class="input-group mb-3">
            <input name="username" class="form-control" placeholder="用户名" autocomplete="username" required>
            <span class="input-group-text"><i class="bi bi-person"></i></span>
          </div>
          <div class="input-group mb-3">
            <input name="password" type="password" class="form-control" placeholder="密码" autocomplete="current-password" required>
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
          </div>
          <div id="error" class="text-danger small mb-3"></div>
          <button class="btn btn-primary w-100" type="submit">登录</button>
        </form>
        <p class="mt-3 mb-0 text-muted small">测试环境后台</p>
      </div>
    </div>
  </div>
  <script>
    fetch('/api/auth/me').then(r => { if (r.ok) location.href = '/'; });
    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const response = await fetch('/api/auth/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.fromEntries(form)) });
      const data = await response.json();
      if (response.ok) location.href = '/';
      else document.getElementById('error').textContent = data.message || '登录失败';
    });
  </script>
</body>
</html>
