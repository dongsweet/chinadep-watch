<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品列表 - Chinadep Watch</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/css/adminlte.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="/console.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary"><div class="app-wrapper">
  <nav class="app-header navbar navbar-expand bg-body"><div class="container-fluid"><a href="/accounts.html" class="navbar-brand brand-mark"><b>Chinadep</b> Watch</a><ul class="navbar-nav ms-auto align-items-center"><li class="nav-item me-2 text-muted small"><i class="bi bi-person-circle me-1"></i><span id="userName">-</span></li><li class="nav-item"><button id="logout" class="btn btn-link nav-link">退出登录</button></li></ul></div></nav>
  <aside class="app-sidebar bg-dark shadow" data-bs-theme="dark"><div class="sidebar-brand"><a href="/accounts.html" class="brand-link"><span class="brand-text fw-light">资产监控平台</span></a></div><div class="sidebar-wrapper"><nav><ul class="nav sidebar-menu flex-column"><li class="nav-item"><a href="/accounts.html" class="nav-link" data-page="accounts"><i class="nav-icon bi bi-box-arrow-in-right"></i><p>平台登录</p></a></li><li class="nav-item"><a href="/products.html" class="nav-link" data-page="products"><i class="nav-icon bi bi-box-seam"></i><p>商品列表</p></a></li><li class="nav-item"><a href="/monitoring.html" class="nav-link" data-page="monitoring"><i class="nav-icon bi bi-bell"></i><p>价格监控</p></a></li></ul></nav></div></aside>
  <main class="app-main"><div class="app-content-header"><div class="container-fluid d-flex align-items-center justify-content-between"><h3 class="mb-0">商品列表</h3><div class="d-flex gap-2"><input id="assetSearch" class="form-control" placeholder="搜索名称 / 发行方 / 类型" style="width:260px"><button id="syncAssets" class="btn btn-primary"><i class="bi bi-arrow-repeat me-1"></i>同步资产目录</button></div></div></div><div class="app-content"><div class="container-fluid">
    <div class="row g-3 mb-3"><div class="col-md-4"><div class="card metric-card h-100"><div class="card-body"><div class="text-muted small">商品总数</div><div id="assetCount" class="metric-value">0</div></div></div></div><div class="col-md-4"><div class="card metric-card h-100"><div class="card-body"><div class="text-muted small">专区商品</div><div id="boardAssetCount" class="metric-value">0</div></div></div></div><div class="col-md-4"><div class="card metric-card h-100"><div class="card-body"><div class="text-muted small">目录同步时间</div><div id="lastSyncedAt" class="metric-value fs-6">-</div></div></div></div></div>
    <div class="card"><div class="card-header"><h3 class="card-title mb-0">目标平台商品目录</h3></div><div class="card-body p-0"><div id="assetMessage" class="small px-3 pt-3"></div><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>商品</th><th>发行方</th><th>类型</th><th>发行价</th><th>交易时间</th><th>专区</th><th class="text-end">操作</th></tr></thead><tbody id="assetsList"><tr><td colspan="7" class="empty-state">还没有同步商品目录</td></tr></tbody></table></div></div></div>
  </div></div></main>
</div>
<div class="modal fade" id="salesModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-xl modal-dialog-centered"><div class="modal-content"><div class="modal-header"><div><h5 id="salesTitle" class="modal-title">销售列表</h5><div id="salesMeta" class="text-muted small"></div></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div><div class="modal-body"><div class="d-flex align-items-center mb-3"><span id="salesCacheBadge" class="badge text-bg-secondary">加载中</span><span id="salesFetchedAt" class="text-muted small ms-2"></span><button id="refreshSales" class="btn btn-sm btn-outline-primary ms-auto"><i class="bi bi-arrow-clockwise me-1"></i>刷新当前页</button></div><div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>记录</th><th>商品</th><th>价格</th><th>挂牌时间</th><th>更新时间</th><th>状态</th></tr></thead><tbody id="salesList"><tr><td colspan="6" class="empty-state">正在加载销售记录...</td></tr></tbody></table></div></div><div class="modal-footer justify-content-between"><select id="salesPageSize" class="form-select form-select-sm" style="width:100px"><option value="10">10 条/页</option><option value="20">20 条/页</option><option value="50">50 条/页</option></select><div class="d-flex align-items-center gap-2"><button id="salesPrev" class="btn btn-sm btn-outline-secondary">上一页</button><span id="salesPager" class="small text-muted">第 1 页</span><button id="salesNext" class="btn btn-sm btn-outline-secondary">下一页</button></div></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/js/adminlte.min.js"></script><script src="/console.js"></script>
<script>
  const { escapeHtml, formatDate, formatNumber, fetchJson, requireAuth, initShell } = ConsoleApp;
  const salesModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('salesModal'));
  const salesState = { assetId: null, pageCount: 1, pageSize: 10, total: 0 };
  let allAssets = [];
  function formatDateRange(start, end) { if (!start && !end) return '-'; return `${escapeHtml(start || '?')}<br><span class="text-muted small">至 ${escapeHtml(end || '?')}</span>`; }
  function renderAssets() { const query = document.getElementById('assetSearch').value.trim().toLowerCase(); const assets = allAssets.filter(asset => !query || [asset.name, asset.issuerName, asset.assetsTypeName, asset.assetsFileTypeName].some(value => String(value || '').toLowerCase().includes(query))); document.getElementById('assetCount').textContent = allAssets.length; document.getElementById('boardAssetCount').textContent = allAssets.filter(asset => asset.tradeBoard === 1).length; document.getElementById('lastSyncedAt').textContent = allAssets[0] ? formatDate(allAssets[0].lastSyncedAt) : '-'; const list = document.getElementById('assetsList'); list.innerHTML = assets.length ? assets.map(asset => `<tr><td><div class="d-flex align-items-center gap-2"><img class="asset-cover" src="${escapeHtml(asset.coverUrl || '')}" onerror="this.style.visibility='hidden'"><div><div class="fw-semibold">${escapeHtml(asset.name)}</div><div class="text-muted small">ID ${escapeHtml(asset.targetAssetId)} · ${escapeHtml(asset.connectionMobile)}</div></div></div></td><td>${escapeHtml(asset.issuerName || '-')}</td><td>${escapeHtml(asset.assetsTypeName || asset.assetsFileTypeName || '-')}</td><td>${asset.issuePrice === null ? '-' : `￥${formatNumber(asset.issuePrice)}`}</td><td>${formatDateRange(asset.tradeStartTime, asset.tradeEndTime)}</td><td>${asset.tradeBoard === 1 ? '<span class="badge text-bg-info">专区</span>' : '<span class="badge text-bg-light">市场</span>'}</td><td class="text-end"><button class="btn btn-sm btn-outline-primary sales-button" data-id="${asset.id}" data-name="${escapeHtml(asset.name)}" data-target-id="${asset.targetAssetId}"><i class="bi bi-list-ul me-1"></i>销售列表</button></td></tr>`).join('') : '<tr><td colspan="7" class="empty-state">没有匹配的商品</td></tr>'; }
  async function loadAssets() { const response = await fetch('/api/assets'); if (!response.ok) return; const data = await response.json(); allAssets = data.assets || []; renderAssets(); }
  async function syncAssets() { const button = document.getElementById('syncAssets'); const message = document.getElementById('assetMessage'); button.disabled = true; message.className = 'small px-3 pt-3 text-muted'; message.textContent = '正在从目标平台同步商品目录...'; try { const { data } = await fetchJson('/api/assets/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' }); message.className = `small px-3 pt-3 ${data.success ? 'text-success' : 'text-danger'}`; message.textContent = data.success ? `同步完成：新增/更新 ${data.synced} 项，共发现 ${data.totalAvailable} 项` : (data.message || '同步失败'); if (data.success) await loadAssets(); } catch (error) { message.className = 'small px-3 pt-3 text-danger'; message.textContent = error.message || '同步请求失败'; } finally { button.disabled = false; } }
  function renderSales(data) { salesState.total = data.total || 0; document.getElementById('salesCacheBadge').className = `badge ${data.cached ? 'text-bg-secondary' : 'text-bg-primary'}`; document.getElementById('salesCacheBadge').textContent = data.cached ? '缓存数据' : '刚刚拉取'; document.getElementById('salesFetchedAt').textContent = `获取于 ${formatDate(data.fetchedAt)}`; const pages = Math.max(1, Math.ceil(salesState.total / salesState.pageSize)); document.getElementById('salesPager').textContent = `第 ${salesState.pageCount} / ${pages} 页，共 ${salesState.total} 条`; document.getElementById('salesPrev').disabled = salesState.pageCount <= 1; document.getElementById('salesNext').disabled = salesState.pageCount >= pages; const list = document.getElementById('salesList'); list.innerHTML = data.rows && data.rows.length ? data.rows.map(row => `<tr><td><div class="d-flex align-items-center gap-2"><img class="sales-cover" src="${escapeHtml(row.coverUrl || '')}" onerror="this.style.visibility='hidden'"><div><div class="fw-semibold">#${escapeHtml(row.id)}</div><div class="text-muted small">持有者 ${escapeHtml(row.customerName || '-')}</div></div></div></td><td><div>${escapeHtml(row.goodsName || row.assetsName || '-')}</div><div class="text-muted small">Token ${escapeHtml(row.tokenId || '-')}</div></td><td>${row.listedPrice === null ? '<span class="text-muted">平台未展示</span>' : `<strong>￥${formatNumber(row.listedPrice)}</strong>`}</td><td>${formatDate(row.listedTime)}</td><td>${formatDate(row.modifyTime)}</td><td><span class="badge text-bg-light">${escapeHtml(row.listedStatus ?? '-')}</span></td></tr>`).join('') : '<tr><td colspan="6" class="empty-state">暂无销售记录</td></tr>'; }
  async function loadSalesPage(refresh = false) { if (!salesState.assetId) return; const params = new URLSearchParams({ pageCount: salesState.pageCount, pageSize: salesState.pageSize }); if (refresh) params.set('refresh', 'true'); const { data } = await fetchJson(`/api/assets/${salesState.assetId}/sales?${params}`); if (!data.success) { document.getElementById('salesList').innerHTML = `<tr><td colspan="6" class="empty-state text-danger">${escapeHtml(data.message || '销售记录加载失败')}</td></tr>`; return; } renderSales(data); }
  document.getElementById('assetSearch').addEventListener('input', renderAssets); document.getElementById('syncAssets').addEventListener('click', syncAssets); document.getElementById('assetsList').addEventListener('click', event => { const button = event.target.closest('.sales-button'); if (!button) return; salesState.assetId = Number(button.dataset.id); salesState.pageCount = 1; salesState.pageSize = 10; document.getElementById('salesTitle').textContent = `${button.dataset.name} · 销售列表`; document.getElementById('salesMeta').textContent = `目标资产 ID：${button.dataset.targetId}`; document.getElementById('salesPageSize').value = '10'; document.getElementById('salesList').innerHTML = '<tr><td colspan="6" class="empty-state">正在加载销售记录...</td></tr>'; salesModal.show(); loadSalesPage(); }); document.getElementById('refreshSales').addEventListener('click', () => loadSalesPage(true)); document.getElementById('salesPrev').addEventListener('click', () => { if (salesState.pageCount > 1) { salesState.pageCount -= 1; loadSalesPage(); } }); document.getElementById('salesNext').addEventListener('click', () => { if (salesState.pageCount < Math.ceil(salesState.total / salesState.pageSize)) { salesState.pageCount += 1; loadSalesPage(); } }); document.getElementById('salesPageSize').addEventListener('change', event => { salesState.pageSize = Number(event.target.value); salesState.pageCount = 1; loadSalesPage(); });
  requireAuth().then(user => { if (!user) return; initShell('products'); loadAssets(); });
</script></body></html>
